<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="METAR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<title>機場天氣場景</title>
<style>
:root{--g:#202020;--w:#fff;--ash:#efefef;--fog:#f5f5f5;--steel:#4d4d4d;--slate:#595959;--mist:#e8e8e8;--ember:#ff682c;--brass:#816729;
--head:"Inter Tight","Space Grotesk","Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--body:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--w);color:var(--g);font:400 15px/1.5 var(--body)}
nav{max-width:1200px;margin:0 auto;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo,h1,.btn,.nm,.tg,.widget h2,.sr b,.cat,summary{font-family:var(--head);font-weight:400;letter-spacing:-.02em}
.logo{margin:0;font-size:20px}
.pill{border:1px solid transparent;background:var(--ash);border-radius:200px;padding:8px 18px;font:400 13px var(--head);letter-spacing:-.02em;color:var(--steel)}
.pill.old{border-color:var(--ember)}
.btn{font-size:16px;line-height:1;padding:10px 20px;border-radius:0;border:1px solid var(--g);background:transparent;color:var(--g);cursor:pointer;margin:0 8px 8px 0}
.btn.p{background:var(--g);color:var(--w)}
.btn:focus-visible,summary:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#msg{display:none;width:calc(100% - 48px);max-width:1152px;margin:0 auto 20px;padding:12px 16px;border-left:2px solid var(--ember);background:var(--fog);color:var(--steel);font-size:14px}
.band{background:var(--ash);padding:64px 0}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.widget{background:var(--w);border-radius:20px;padding:32px 40px;overflow-x:auto}
.widget h2{margin:0 0 20px;font-size:18px;line-height:1.25}
.sr{display:grid;grid-template-columns:minmax(110px,1.1fr) 80px 1.4fr 1fr 1fr 1.6fr;gap:12px 20px;align-items:center;padding:14px 0;border-top:1px solid var(--mist);min-width:640px;cursor:pointer}
.sr.h{border:0;padding:0 0 8px;color:var(--slate);font-size:12px;cursor:default}
.sr b{font-size:18px}
.sr small{display:block;color:var(--slate);font-size:12px}
.tg{display:inline-block;padding:0 12px;border:1px solid;border-radius:20px;font-size:13px;background:var(--w)}
main{max-width:1200px;margin:0 auto;padding:12px 24px 64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.card{background:var(--ash);border-radius:6px 0 0 0;overflow:hidden;scroll-margin-top:20px}
.card.alert{outline:1px solid var(--ember);outline-offset:-1px}
.sc{position:relative}
canvas{display:block;width:100%;height:210px}
.nm{position:absolute;top:16px;left:16px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.88);font-size:22px;line-height:1.1}
.nm small{display:block;font:400 12px var(--body);letter-spacing:0;color:var(--steel)}
.cat{position:absolute;top:16px;right:16px}
.bd{position:absolute;left:16px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.bd span{background:rgba(255,255,255,.9);border-radius:20px;padding:0 10px;font-size:12px}
.bd .a{border:1px solid var(--ember)}
.bd .a::before,.al::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ember);margin-right:6px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px}
.info b{display:block;margin-bottom:2px;font:500 12px var(--body);color:var(--slate)}
.f{grid-column:1/-1}
.wd{display:flex;gap:16px;align-items:center}
.wd svg{flex:none}
.raw{font-size:12px;color:var(--slate);word-break:break-all;border-top:1px solid var(--mist);padding-top:12px}
.sp small{display:block;font-size:12px;color:var(--slate)}
summary{display:inline-block;list-style:none;cursor:pointer;font-size:14px;padding:8px 16px;border:1px solid var(--g)}
summary::-webkit-details-marker{display:none}
.dec{white-space:pre-wrap;font:400 13px/1.7 var(--body);margin:8px 0 0;padding:16px;background:var(--w);border-radius:6px 0 0 0;color:var(--steel)}
.nr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
nav .btn{font-size:14px;padding:8px 14px;margin:0}
.mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font-size:14px}
.more{display:grid;gap:14px;margin-top:12px}
.more .dec{margin:4px 0 0}
footer{background:var(--ash);padding:60px 0}
footer p{max-width:1200px;margin:0 auto;padding:0 24px;font-size:14px;line-height:1.5;color:var(--steel)}
html{-webkit-text-size-adjust:100%}
a.sr{color:inherit;text-decoration:none}
a.sr:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.no{color:var(--slate)}
:root{color-scheme:light}
body{-webkit-tap-highlight-color:transparent}
select.btn{-webkit-appearance:none;appearance:none;border-radius:0}
nav{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
footer{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.chips{display:none}
@media(max-width:700px){
  nav{flex-direction:column;align-items:stretch;gap:10px;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-right))}
  .nr{justify-content:space-between}
  .pill{flex:1 0 100%;text-align:center}
  nav .btn,select.btn{min-height:44px;font-size:16px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;-webkit-overflow-scrolling:touch}
  .chip{flex:none;padding:6px 12px;border:1px solid var(--g);border-radius:20px;font:400 14px var(--head);color:var(--g);text-decoration:none;white-space:nowrap}
  .chip.a{border-color:var(--ember)}
  main{padding:8px 16px 40px;gap:16px}
  canvas{height:170px}
  .band{padding:40px 0}
  .widget{padding:20px 16px;border-radius:12px}
  .sr{display:flex;flex-wrap:wrap;gap:4px 12px;min-width:0}
  .sr.h{display:none}
  summary{min-height:44px;line-height:26px}
}
.sc canvas.fx{position:absolute;left:0;top:0;pointer-events:none}
.fg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
</style>
</head>
<body>
<nav>
  <h1 class="logo">METAR 機場天氣</h1>
  <div class="nr">
    <div class="pill" id="bar"><span id="st">載入中…</span></div>
    <button class="btn p" id="rf">重新整理</button>
    <button class="btn" id="pw" aria-label="動畫模式"></button>
    <select class="btn" id="mode" aria-label="預覽情境"></select>
  </div>
</nav>
<div class="chips" id="chips"></div>
<div id="msg"></div>
<main id="main"></main>
<section class="band"><div class="wrap"><div class="widget" id="sum"></div></div></section>
<footer><p>場景朝南看：左側是東、右側是西。順逆風與側風以 METAR 風向（真北）對照跑道真方位計算，只是參考，不等於各機型的作業限制；側風 20 kt 以上會標示注意。跑道取自公開資料：松山 10/28、桃園 05/23、虹橋 18/36、浦東 16/17 與 34/35。METAR 沒有颱風欄位，強風與暴風標籤只依風速判斷。</p></footer>
<script>
const API = '貼上你的 GAS /exec 網址';
const META = {
  TSA: ['RCSS', '松山', 25.0697, 121.5522],
  TPE: ['RCTP', '桃園', 25.0777, 121.2328],
  SHA: ['ZSSS', '上海虹橋', 31.1979, 121.3363],
  PVG: ['ZSPD', '上海浦東', 31.1443, 121.8083]
};
const CATC = { VFR: '#202020', MVFR: '#816729', IFR: '#ff682c', LIFR: '#202020' };
const COV = { FEW: .2, SCT: .45, BKN: .75, OVC: 1, OVX: 1, VV: 1 };
const PRE = {
  sunny: ['晴朗大太陽', { raw: '（示範）18008KT CAVOK 35/22 Q1008', temp: 35, dewp: 22, altim: 1008, wdir: 180, wspd: 8, visib: '6+', clouds: [], wxString: '', fltCat: 'VFR', elev: 60 }],
  storm: ['雷雨陣風', { raw: '（示範）27018G32KT 3000 +TSRA SCT008 BKN015CB 24/23 Q1005', temp: 24, dewp: 23, altim: 1005, wdir: 270, wspd: 18, wgst: 32, visib: 1.9, clouds: [{ cover: 'SCT', base: 800 }, { cover: 'BKN', base: 1500 }], wxString: '+TSRA', fltCat: 'IFR', elev: 25 }],
  typhoon: ['強風豪雨', { raw: '（示範）04035G52KT 1600 +RA BKN006 OVC015 25/24 Q0975', temp: 25, dewp: 24, altim: 975, wdir: 40, wspd: 35, wgst: 52, visib: 1, clouds: [{ cover: 'BKN', base: 600 }, { cover: 'OVC', base: 1500 }], wxString: '+RA', fltCat: 'IFR', elev: 30 }],
  fog: ['濃霧', { raw: '（示範）00000KT 0400 FG OVC002 12/12 Q1020', temp: 12, dewp: 12, altim: 1020, wdir: 0, wspd: 1, visib: .25, clouds: [{ cover: 'OVC', base: 200 }], wxString: 'FG', fltCat: 'LIFR', elev: 15 }],
  night: ['夜間小雨', { raw: '（示範）09008KT 5000 -RA BKN012 OVC030 18/16 Q1014', temp: 18, dewp: 16, altim: 1014, wdir: 90, wspd: 8, visib: 3, clouds: [{ cover: 'BKN', base: 1200 }, { cover: 'OVC', base: 3000 }], wxString: '-RA', fltCat: 'MVFR', elev: -30 }]
};
let snap = null, hist = null, mode = 'live', sig = '', est = 600000, lastOk = 0, timer = null, fails = 0, late = 0, pending = false, stSrc = null;
const cards = {};

// ---------- 小工具 ----------
const cl = (x, a, b) => Math.min(b, Math.max(a, x));
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = (c, a) => 'rgba(' + c.map(Math.round).join(',') + ',' + (a == null ? 1 : a) + ')';
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hm = ms => new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(ms);
const dm = ms => new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(ms);

// 太陽高度與時角（度）
function sun(lat, lon) {
  const R = Math.PI / 180, d = (Date.now() - 946728000000) / 864e5;
  const L = (280.46 + .9856474 * d) % 360, g = ((357.528 + .9856003 * d) % 360) * R;
  const lm = (L + 1.915 * Math.sin(g) + .02 * Math.sin(2 * g)) * R, ep = (23.439 - 4e-7 * d) * R;
  const dec = Math.asin(Math.sin(ep) * Math.sin(lm)), ra = Math.atan2(Math.cos(ep) * Math.sin(lm), Math.cos(lm));
  let ha = (280.46061837 + 360.98564736629 * d) % 360 + lon - ra / R;
  ha = ((ha % 360) + 540) % 360 - 180;
  const e = Math.asin(Math.sin(lat * R) * Math.sin(dec) + Math.cos(lat * R) * Math.cos(dec) * Math.cos(ha * R)) / R;
  return { e, ha };
}

// ---------- 把 METAR 資料轉成場景參數 ----------
function derive(d, m) {
  let wx = d.wxString != null ? String(d.wxString) : String(d.raw || '').split(/RMK|TEMPO|BECMG/)[0].split(/\s+/)
    .filter(t => /^([+-]|VC)?(MI|BC|PR|DR|BL|SH|TS|FZ)?(DZ|RA|SN|SG|PL|GR|GS|UP|BR|FG|HZ|FU|DU|SA|SS|DS|FC|SQ)*$/.test(t) && t).join(' ');
  const s = { rain: 0, snow: 0, ts: /TS/.test(wx), fog: 0, hail: /GR|GS/.test(wx), wx };
  wx.split(/\s+/).filter(Boolean).forEach(t => {
    const k = t[0] === '+' ? 3 : t[0] === '-' ? 1 : 2;
    if (/DZ/.test(t)) s.rain = Math.max(s.rain, 1);
    if (/RA|GR|GS/.test(t)) s.rain = Math.max(s.rain, k);
    if (/SN|SG|PL|IC/.test(t)) s.snow = Math.max(s.snow, k);
    if (/FG/.test(t)) s.fog = Math.max(s.fog, .6);
    if (/BR|FU/.test(t)) s.fog = Math.max(s.fog, .25);
    if (/HZ|DU|SA/.test(t)) s.fog = Math.max(s.fog, .2);
  });
  const v = String(d.visib == null ? '6+' : d.visib);
  s.vkm = v.slice(-1) === '+' ? 10 : Math.min(10, (parseFloat(v) || 6) * 1.609);
  s.layers = (d.clouds || []).filter(c => COV[c.cover] != null && c.base != null).map(c => ({ cover: c.cover, base: c.base, cov: COV[c.cover] }));
  s.cc = s.layers.reduce((a, l) => Math.max(a, l.cov), 0);
  s.ceil = s.layers.filter(l => l.cov >= .75).reduce((a, l) => Math.min(a, l.base), Infinity);
  s.cb = s.ts || /CB|TCU/.test(d.raw || '');
  s.spd = Number(d.wspd) || 0; s.gst = Number(d.wgst) || 0;
  s.vrb = d.wdir === 'VRB'; s.dir = Number(d.wdir) || 0;
  const vr = /(?:^|\s)(\d{3})V(\d{3})(?:\s|$)/.exec(d.raw || ''); s.vr = vr ? [+vr[1], +vr[2]] : null;
  s.ws = []; const wsRaw = String(d.raw || '').split(/\sRMK\s/)[0], wsRe = /(?:^|\s)WS\s+(?:(ALL)\s+RWY|R(?:WY)?(\d{2}[LCR]?))(?=\s|$)/g; let w;
  while ((w = wsRe.exec(wsRaw))) s.ws.push(w[1] ? '全部跑道' : '跑道 ' + w[2]);
  s.temp = d.temp;
  const sn = sun(m[2], m[3]);
  s.e = d.elev != null ? d.elev : sn.e; s.ha = d.elev != null ? 0 : sn.ha;
  return s;
}

// ---------- 場景 ----------
function build(c) {
  const s = c.s, r = rng(c.seed), k = c.W / 420, HY = c.H * .74;
  c.clouds = [];
  c.cvar = Array.from({ length: 4 }, () => Array.from({ length: 6 }, (_, j) => [(j - 2.5) * 28, -Math.sin(j * 1.3 + r() * 6) * 8, 22 + r() * 12]));
  s.layers.forEach(L => {
    const n = Math.max(1, Math.round(L.cov * 9));
    for (let i = 0; i < n; i++) {
      const sz = .7 + r() * .6;
      c.clouds.push({
        x: ((i + .5) / n) * 1.3 - .15 + (r() - .5) * .08,
        y: HY - Math.min(L.base, 14000) / 14000 * c.H * .55 - 12 + (r() - .5) * 14,
        sf: .6 + L.base / 14000 * .8,
        sz, v: i % 4
      });
    }
  });
  const kind = s.snow ? s.snow : s.rain, n = s.snow ? [0, 25, 55, 100][kind] : [0, 45, 100, 180][kind];
  c.drops = Array.from({ length: n * (c.W / 420) | 0 }, () => ({ x: r() * c.W, y: r() * c.H, l: .7 + r() * .6, gy: HY + 6 + r() * (c.H - HY - 10) }));
  c.stars = Array.from({ length: 40 }, () => ({ x: r() * c.W, y: r() * HY * .8, p: r() * 6 }));
  c.nextF = 1 + r() * 3; c.flash = 0; c.bolt = null; c.sp = []; c.dirty = true;
}

function skyCols(e) {
  const N = [[10, 16, 40], [30, 44, 82]], T = [[62, 72, 125], [250, 160, 110]], D = [[58, 138, 226], [172, 216, 250]];
  if (e < -6) return N;
  if (e < 2) { const t = (e + 6) / 8; return [mix(N[0], T[0], t), mix(N[1], T[1], t)]; }
  if (e < 12) { const t = (e - 2) / 10; return [mix(T[0], D[0], t), mix(T[1], D[1], t)]; }
  return D;
}

// 靜態層：天空、星、日月、地面、跑道、航廈、塔台、跑道燈。只在資料、尺寸或太陽位置改變時重畫
function paintBg(c) {
  const ctx = c.bctx, W = c.W, H = c.H, s = c.s, k = W / 420, HY = H * .74, e = s.e, df = cl((e + 6) / 18, 0, 1);
  ctx.clearRect(0, 0, W, H);
  let [top, bot] = skyCols(e);
  const gf = cl(s.cc * .55 + (s.rain || s.snow || s.ts ? .25 : 0) + (s.cb ? .15 : 0), 0, .85), gray = mix([34, 40, 52], [150, 158, 170], df);
  top = mix(top, gray, gf); bot = mix(bot, mix(gray, [255, 255, 255], .12), gf);
  const g = ctx.createLinearGradient(0, 0, 0, HY); g.addColorStop(0, rgba(top)); g.addColorStop(1, rgba(bot));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (e < -4) {
    ctx.fillStyle = 'rgba(255,255,255,' + (.75 * (1 - s.cc) * cl((-4 - e) / 6, 0, 1)) + ')';
    c.stars.forEach(o => ctx.fillRect(o.x, o.y, 1.5, 1.5));
  }
  const vis = 1 - cl(s.cc * 1.05, 0, 1);
  if (e > -3) {
    const x = W * (.5 + cl(s.ha / 120, -.42, .42)), y = HY - cl(e, 0, 75) / 75 * HY * .82 - 8, hot = s.temp >= 33 ? 1.25 : 1;
    const col = mix([255, 170, 90], [255, 245, 215], cl(e / 20, 0, 1)), r = 16 * k * hot;
    const gg = ctx.createRadialGradient(x, y, 0, x, y, r * 5); gg.addColorStop(0, rgba(col, .55 * vis)); gg.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = gg; ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
    ctx.fillStyle = rgba(col, .4 + .6 * vis); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(235,238,245,' + (.15 + .85 * vis) + ')'; ctx.beginPath(); ctx.arc(W * .78, H * .2, 10 * k, 0, 7); ctx.fill();
  }
  if (e > -4 && e < 14) {
    const ga = (1 - Math.abs(e - 3) / 11) * (1 - s.cc * .6) * .5, gx = W * (.5 + cl(s.ha / 120, -.42, .42));
    const gl = ctx.createRadialGradient(gx, HY, 0, gx, HY, W * .6);
    gl.addColorStop(0, 'rgba(255,104,44,' + ga + ')'); gl.addColorStop(1, 'rgba(255,104,44,0)');
    ctx.fillStyle = gl; ctx.fillRect(0, 0, W, HY);
  }
  ctx.fillStyle = rgba(mix([20, 34, 28], [58, 98, 60], df)); ctx.fillRect(0, HY, W, H - HY);
  const ry = HY + (H - HY) * .42, rh = (H - HY) * .34, dk = rgba(mix([14, 18, 28], [72, 78, 92], df));
  ctx.fillStyle = rgba(mix([30, 32, 38], [78, 80, 88], df)); ctx.fillRect(0, ry, W, rh);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let x = 6; x < W; x += 34 * k) ctx.fillRect(x, ry + rh / 2 - 1, 16 * k, 2);
  ctx.fillStyle = dk;
  ctx.fillRect(W * .1, HY - 26 * k, 7 * k, 26 * k); ctx.fillRect(W * .1 - 5 * k, HY - 34 * k, 17 * k, 9 * k); ctx.fillRect(W * .2, HY - 10 * k, W * .24, 10 * k);
  if (e < 4) {
    ctx.fillStyle = 'rgba(255,205,120,' + cl((4 - e) / 8, 0, 1) + ')';
    for (let x = 8; x < W; x += 16 * k) { ctx.fillRect(x, ry - 1, 2 * k, 2 * k); ctx.fillRect(x, ry + rh - 1, 2 * k, 2 * k); }
  }
  const fa = Math.max(cl((10 - s.vkm) / 10, 0, 1) * .8, s.fog * .6), fc = mix([90, 98, 112], [222, 228, 236], df);
  c.fg.style.background = fa > .02 ? 'linear-gradient(' + rgba(fc, fa * .55) + ',' + rgba(fc, fa) + ')' : 'none';
}

// 雲只畫一次成小圖，之後每幀只貼圖
function makeSprites(c) {
  const s = c.s, k = c.W / 420, df = cl((s.e + 6) / 18, 0, 1), dpr = c.dpr || 1;
  const storm = cl(s.rain / 4 + (s.ts ? .5 : 0) + (s.ceil < 2500 ? .25 : 0) + (s.cb ? .3 : 0), 0, 1);
  const base = mix(mix([70, 78, 98], [250, 251, 253], df), mix([60, 64, 74], [110, 114, 124], df), storm);
  c.spr = c.cvar.map(v => {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    v.forEach(b => { x0 = Math.min(x0, b[0] - b[2]); x1 = Math.max(x1, b[0] + b[2]); y0 = Math.min(y0, b[1] - b[2]); y1 = Math.max(y1, b[1] + b[2] + 5); });
    const w = (x1 - x0) * k, h = (y1 - y0) * k, cv = document.createElement('canvas'), x = cv.getContext('2d');
    cv.width = Math.ceil(w * dpr); cv.height = Math.ceil(h * dpr); x.setTransform(dpr, 0, 0, dpr, 0, 0);
    [[5, mix(base, [0, 0, 0], .14), .9], [0, base, .93]].forEach(q => {
      x.fillStyle = rgba(q[1], q[2]); x.beginPath();
      v.forEach(b => { const px = (b[0] - x0) * k, py = (b[1] - y0 + q[0]) * k; x.moveTo(px + b[2] * k, py); x.arc(px, py, b[2] * k, 0, 7); });
      x.fill();
    });
    return { cv, w, h, ox: -x0 * k, oy: -y0 * k };
  });
}

// 前景：只畫會動的東西。dt = 0 代表靜態畫面（省電模式），不推進任何動畫
function draw(c, t, dt) {
  if (c.dirty) { paintBg(c); makeSprites(c); c.dirty = false; }
  const { ctx, W, H, s } = c, k = W / 420, HY = H * .74, e = s.e, df = cl((e + 6) / 18, 0, 1);
  const pulse = .5 + .5 * Math.sin(t * 1.3 + Math.sin(t * .37) * 3);
  const spd = s.spd + (s.gst > s.spd ? (s.gst - s.spd) * pulse : 0);
  const dx = s.vrb ? Math.sin(t * .4) * .8 : Math.sin(s.dir * Math.PI / 180);
  const ry = HY + (H - HY) * .42, rh = (H - HY) * .34, dk = rgba(mix([14, 18, 28], [72, 78, 92], df));
  ctx.clearRect(0, 0, W, H);

  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, HY + 2); ctx.clip();
  c.clouds.forEach(o => {
    o.x += dx * (6 + spd * 2.4) * k * o.sf * dt / W;
    if (o.x > 1.15) o.x = -.15; if (o.x < -.15) o.x = 1.15;
    const q = c.spr[o.v];
    ctx.drawImage(q.cv, o.x * W - q.ox * o.sz, o.y - q.oy * o.sz, q.w * o.sz, q.h * o.sz);
  });
  ctx.restore();

  const lean = dx * Math.min(spd, 30) / 30 * 9 * k;
  [.52, .58, .66].forEach((fx, i) => {
    const bx = W * fx, sw = lean + Math.sin(t * 2 + i) * Math.min(spd, 30) / 30 * 2.5 * k;
    ctx.strokeStyle = dk; ctx.lineWidth = 2 * k; ctx.beginPath(); ctx.moveTo(bx, HY + 4 * k); ctx.lineTo(bx + sw * .5, HY - 14 * k); ctx.stroke();
    ctx.fillStyle = rgba(mix([30, 40, 34], [92, 110, 84], df)); ctx.beginPath(); ctx.arc(bx + sw, HY - 18 * k, 8 * k, 0, 7); ctx.fill();
  });
  if (c.land) {
    const pr = ((t + c.seed % 7) % 16) / 16, gy = ry + rh * .5, y0 = HY - 70 * k, fl = pr < .4;
    const sx = c.land > 0 ? -.1 : 1.1, ex = c.land > 0 ? 1.1 : -.1, sc = k * (.8 + .5 * (fl ? pr / .4 : 1));
    ctx.save(); ctx.translate(W * (sx + (ex - sx) * pr), (fl ? y0 + (gy - y0) * pr / .4 : gy) - 3 * sc);
    ctx.scale(c.land, 1); ctx.globalAlpha = cl(s.vkm / 6, .3, 1); ctx.fillStyle = dk;
    ctx.beginPath(); ctx.ellipse(0, 0, 14 * sc, 2.8 * sc, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2 * sc, 0); ctx.lineTo(-8 * sc, 9 * sc); ctx.lineTo(-4 * sc, 9 * sc); ctx.lineTo(5 * sc, 0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-12 * sc, -sc); ctx.lineTo(-15 * sc, -7 * sc); ctx.lineTo(-11 * sc, -sc); ctx.fill(); ctx.restore();
  }

  const px = W * .9, py = HY + (H - HY) * .22, len = 34 * k, sg = dx >= 0 ? 1 : -1;
  const ang = (1 - Math.min(spd, 15) / 15) * 1.2 + Math.sin(t * 6) * .05 * Math.min(spd, 15) / 15;
  const tx = px + sg * len * Math.cos(ang), ty = py - len + len * Math.sin(ang), n1 = 4 * k;
  ctx.strokeStyle = '#9aa4b2'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py - len); ctx.stroke();
  ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.moveTo(px, py - len - n1); ctx.lineTo(tx, ty - n1 * .5); ctx.lineTo(tx, ty + n1 * .5); ctx.lineTo(px, py - len + n1); ctx.fill();

  if (c.drops.length) {
    const tl = Math.max(.03, Math.min(dt, .08));                       // 幀率低時拉長雨絲，視覺上仍連續
    const vy = (s.snow ? 55 : 520) * k, vx = dx * spd * (s.snow ? 3 : 9) * k;
    if (s.snow) ctx.fillStyle = 'rgba(255,255,255,.85)'; else { ctx.strokeStyle = 'rgba(195,215,240,.55)'; ctx.lineWidth = Math.max(1, k); ctx.beginPath(); }
    c.drops.forEach((o, i) => {
      o.x += (vx + (s.snow ? Math.sin(t + i) * 10 : 0)) * o.l * dt; o.y += vy * o.l * dt;
      if (o.y > (o.gy || H)) { if (!s.snow && o.gy && c.sp.length < 40) c.sp.push({ x: o.x, y: o.gy, a: 0 }); o.y = -10; o.x = Math.random() * W; }
      if (o.x > W + 30) o.x -= W + 60; if (o.x < -30) o.x += W + 60;
      if (s.snow) { ctx.beginPath(); ctx.arc(o.x, o.y, 1.4 * k * o.l, 0, 7); ctx.fill(); }
      else { ctx.moveTo(o.x, o.y); ctx.lineTo(o.x - vx * tl * o.l, o.y - vy * tl * o.l); }
    });
    if (!s.snow) ctx.stroke();
    c.sp = c.sp.filter(q => (q.a += dt * 3) < 1); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
    c.sp.forEach(q => { ctx.globalAlpha = 1 - q.a; ctx.beginPath(); ctx.ellipse(q.x, q.y, 2 * k + q.a * 6 * k, (1 + q.a * 2) * k, 0, 0, 7); ctx.stroke(); });
    ctx.globalAlpha = 1;
  }

  if (s.ts && dt > 0) {
    if (t > c.nextF) {
      c.flash = 1; c.nextF = t + 2 + Math.random() * 6;
      let x = W * (.15 + Math.random() * .7), y = HY * .45; c.bolt = [[x, y]];
      while (y < HY) { y += 14 * k; x += (Math.random() - .5) * 26 * k; c.bolt.push([x, y]); }
      c.boltT = t;
    }
    if (t - c.boltT < .15 && c.bolt) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * k; ctx.shadowColor = '#bcd7ff'; ctx.shadowBlur = 14; ctx.beginPath();
      c.bolt.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.shadowBlur = 0;
    }
    if (c.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + c.flash * .3 + ')'; ctx.fillRect(0, 0, W, H); c.flash -= dt * 5; }
  }
}

// ---------- 卡片 ----------
function resize(c) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.W = c.cv.clientWidth; c.H = c.cv.clientHeight; c.dpr = dpr;
  [[c.cv, c.bctx], [c.fcv, c.ctx]].forEach(p => { p[0].width = c.W * dpr; p[0].height = c.H * dpr; p[1].setTransform(dpr, 0, 0, dpr, 0, 0); });
  if (c.s) build(c);
  need = true; kick();
}

function ensure(key) {
  if (cards[key]) return cards[key];
  const el = document.createElement('section'); el.className = 'card';
  el.innerHTML = '<div class="sc"><canvas class="bg"></canvas><canvas class="fx" aria-hidden="true"></canvas><div class="fg"></div><div class="nm"></div><div class="cat"></div><div class="bd"></div></div><div class="info"></div>';
  document.getElementById('main').appendChild(el);
  const cv = el.querySelector('canvas.bg'), fcv = el.querySelector('canvas.fx');
  const c = cards[key] = { el, cv, fcv, fg: el.querySelector('.fg'), bctx: cv.getContext('2d'), ctx: fcv.getContext('2d'), seed: key.charCodeAt(0) * 97 + key.charCodeAt(1) };
  if (window.ResizeObserver) new ResizeObserver(() => resize(c)).observe(cv); else addEventListener('resize', () => resize(c));
  if (window.IntersectionObserver) new IntersectionObserver(es => { c.vis = es[0].isIntersecting; need = true; kick(); }).observe(cv);
  resize(c);
  return c;
}

const RWY = { TSA: [['10', 92], ['28', 272]], TPE: [['05L/R', 49], ['23L/R', 229]], SHA: [['18', 176], ['36', 356]], PVG: [['16/17', 162], ['34/35', 342]] };
const RANK = { VFR: 0, MVFR: 1, IFR: 2, LIFR: 3 };
const sm = {};
const catHtml = c => '<span class="tg" style="' + (c === 'LIFR' ? 'background:#202020;color:#fff;border-color:#202020' : 'color:' + (CATC[c] || '#4d4d4d')) + '">' + c + '</span>';

function spark(v, col) {
  v = v.filter(x => typeof x === 'number');
  if (v.length < 2) return '<small style="color:#595959">資料累積中</small>';
  const mn = Math.min(...v), mx = Math.max(...v), r = mx - mn || 1;
  const p = v.map((y, i) => (i / (v.length - 1) * 200).toFixed(1) + ',' + (28 - (y - mn) / r * 26).toFixed(1)).join(' ');
  return '<div class="sp"><svg viewBox="0 0 200 30" width="100%" height="34" preserveAspectRatio="none"><polyline points="' + p +
    '" fill="none" stroke="' + col + '" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><small>' + mn + ' ～ ' + mx + '（' + v.length + ' 筆）</small></div>';
}

// 逆風最大的跑道端；風小或風向不定時不計算
function rwy(key, s) {
  const R = RWY[key];
  if (s.vrb || !s.spd) return { e: R[0], hw: 0, xw: 0, gx: 0, calm: true };
  let best = null;
  R.forEach(e => {
    const a = (s.dir - e[1]) * Math.PI / 180, hw = s.spd * Math.cos(a);
    if (!best || hw > best.hw) best = { e, hw, xw: s.spd * Math.sin(a), gx: Math.abs((s.gst || s.spd) * Math.sin(a)) };
  });
  return best;
}

function dial(s, r) {
  const arrow = s.vrb || !s.spd ? '' : '<g transform="rotate(' + s.dir + ')"><path d="M0-40V-12M-5-20L0-12L5-20" fill="none" stroke="#ff682c" stroke-width="2.5"/></g>';
  let sec = '';
  if (s.vr && s.spd) {
    const p = a => [(40 * Math.sin(a * Math.PI / 180)).toFixed(1), (-40 * Math.cos(a * Math.PI / 180)).toFixed(1)], a = p(s.vr[0]), b = p(s.vr[1]);
    sec = '<path d="M0 0L' + a.join(' ') + 'A40 40 0 ' + (((s.vr[1] - s.vr[0] + 360) % 360) > 180 ? 1 : 0) + ' 1 ' + b.join(' ') + 'Z" fill="#ff682c" opacity=".14"/>';
  }
  return '<svg width="96" height="96" viewBox="-48 -48 96 96"><circle r="44" fill="#fff" stroke="#e8e8e8"/>' + sec +
    '<line y1="-34" y2="34" stroke="#816729" stroke-width="5" opacity=".35" transform="rotate(' + r.e[1] + ')"/>' + arrow +
    '<text y="-33" font-size="9" text-anchor="middle" fill="#595959">N</text>' +
    '<text y="4" font-size="14" text-anchor="middle" fill="#202020">' + (s.vrb ? 'VRB' : s.spd) + '</text><text y="15" font-size="8" text-anchor="middle" fill="#595959">kt</text></svg>';
}

function upsert(key, d, h) {
  const m = META[key], c = ensure(key), s = derive(d, m), r = rwy(key, s);
  const age = d.obsTime ? Math.max(0, Math.round((Date.now() / 1000 - d.obsTime) / 60)) : null;
  const sg = JSON.stringify([d.raw, d.obsTime, d.wxString, d.decoded, d.fltCat, h ? h.length : 0, !!(d.isSpeci && age != null && age <= 90)]);
  if (c.sg === sg) return false;                       // 資料沒變：不重畫，動畫也不會跳
  c.sg = sg; c.s = s; c.dirty = true;
  c.land = Math.sin(r.e[1] * Math.PI / 180) >= 0 ? -1 : 1;
  c.el.id = 'c-' + key;
  const ss = JSON.stringify([s.layers, s.rain, s.snow, s.ts, s.cb]);
  if (c.ss !== ss) { c.ss = ss; build(c); }          // 天氣場景沒變就沿用原本的雲與雨
  const comp = ['北', '北北東', '東北', '東北東', '東', '東南東', '東南', '南南東', '南', '南南西', '西南', '西南西', '西', '西北西', '西北', '北北西'];
  const visT = s.vkm >= 10 ? '10 km 以上' : s.vkm.toFixed(1) + ' km';
  const ceilT = isFinite(s.ceil) ? s.ceil.toLocaleString() + ' ft' : '無';
  const al = [];
  if (s.ws.length) al.push('風切'); if (s.ts) al.push('雷暴'); if (/FG/.test(s.wx)) al.push('霧');
  if (s.ceil < 1000) al.push('低雲幕'); if (s.vkm < 4.8) al.push('低能見度');
  if (s.spd >= 34) al.push('暴風'); else if (s.spd >= 22 || s.gst >= 34) al.push('強風');
  if (r.gx >= 20) al.push('側風 ' + Math.round(r.gx) + ' kt');
  if (d.isSpeci && (age == null || age <= 90)) al.push('SPECI');
  const tg = [];
  if (s.rain) tg.push(/DZ/.test(s.wx) && !/RA/.test(s.wx) ? '毛毛雨' : (/SH/.test(s.wx) ? ['', '小陣雨', '陣雨', '大陣雨'] : ['', '小雨', '雨', '大雨'])[s.rain]);
  if (s.snow) tg.push('雪');
  if (/BR|FU/.test(s.wx)) tg.push('薄霧'); else if (/HZ/.test(s.wx)) tg.push('霾'); if (s.temp >= 33) tg.push('酷熱');
  const windT = (s.vrb ? '風向不定' : comp[Math.round(s.dir / 22.5) % 16] + '風 ' + String(s.dir).padStart(3, '0') + '°') + '，' + s.spd + ' kt' + (s.gst ? '，陣風 ' + s.gst + ' kt' : '') +
    (s.vr ? '；風向在 ' + s.vr.map(x => String(x).padStart(3, '0')).join('°～') + '° 間變化' : '') +
    (s.ws.length ? '；風切：' + s.ws.join('、') : '');
  const rwT = r.calm ? '風小或風向不定，不計算順逆風' : '逆風最大：跑道 ' + r.e[0] + '，逆風 ' + Math.round(r.hw) + ' kt、' +
    (r.xw > 0 ? '右' : '左') + '側風 ' + Math.round(Math.abs(r.xw)) + ' kt' + (s.gst > s.spd ? '（陣風時側風 ' + Math.round(r.gx) + ' kt）' : '');
  c.cv.setAttribute('role', 'img');
  c.cv.setAttribute('aria-label', (d.name || m[1]) + '：' + (d.fltCat || '') + (al.length ? '，注意：' + al.join('、') : '') + (tg.length ? '，' + tg.join('、') : '') + '，' + windT + '，能見度 ' + visT + '，雲幕 ' + ceilT);
  c.el.classList.toggle('alert', al.length > 0);
  c.el.querySelector('.nm').innerHTML = esc(d.name || m[1]) + '<small>' + (d.icao || m[0]) + ' / ' + key + '</small>';
  c.el.querySelector('.cat').innerHTML = catHtml(d.fltCat || '—');
  c.el.querySelector('.bd').innerHTML = al.map(x => '<span class="a">' + x + '</span>').concat(tg.map(x => '<span>' + x + '</span>')).join('');
  c.el.querySelector('.info').innerHTML =
    '<div class="f wd">' + dial(s, r) + '<div><b>風</b>' + windT + '<br><span style="color:#4d4d4d">' + rwT + '</span></div></div>' +
    '<div class="f mini"><div><b>能見度</b>' + visT + '</div><div><b>雲幕</b>' + ceilT + '</div><div><b>氣溫／露點</b>' + d.temp + '° / ' + d.dewp + '°</div></div>' +
    '<div class="f"><b>觀測（台北時間）</b>' + (d.obsTime ? dm(d.obsTime * 1000) + '，<span class="ago" data-o="' + d.obsTime + '">' + age + ' 分鐘前</span>' : '—') + '</div>' +
    '<details class="f"><summary>更多資料</summary><div class="more">' +
    '<div><b>雲</b>' + (s.layers.length ? s.layers.map(l => l.cover + ' ' + l.base.toLocaleString() + ' ft').join('、') : '無雲／CAVOK') + '</div>' +
    '<div><b>氣壓</b>' + d.altim + ' hPa</div>' +
    '<div><b>近 24 小時風速（kt）</b>' + spark((h || []).map(x => x.wspd), '#ff682c') + '</div>' +
    '<div><b>近 24 小時氣溫（°C）</b>' + spark((h || []).map(x => x.temp), '#816729') + '</div>' +
    '<div><b>中文解讀</b><pre class="dec">' + esc(d.decoded || '') + '</pre></div>' +
    '<div class="raw">' + esc(d.raw || '') + '</div></div></details>';
  sm[key] = { k: key, name: d.name || m[1], cat: catHtml(d.fltCat || '—'), al,
    wind: (s.vrb ? 'VRB' : s.dir + '°') + ' ' + s.spd + ' kt' + (s.gst ? ' G' + s.gst : ''), vis: visT, ceil: ceilT,
    sev: (RANK[d.fltCat] || 0) * 2 + al.length };
  need = true; kick();
  return true;
}

function renderChips() {
  document.getElementById('chips').innerHTML = Object.keys(META).filter(k => sm[k]).map(k => {
    const o = sm[k];
    return '<a class="chip' + (o.al.length ? ' a' : '') + '" href="#c-' + k + '">' + k + ' ' + o.cat.replace(/<[^>]+>/g, '') + (o.al.length ? ' •' : '') + '</a>';
  }).join('');
}

function renderSummary() {
  const rows = Object.keys(sm).map(k => sm[k]).sort((a, b) => b.sev - a.sev);
  document.getElementById('sum').innerHTML = '<h2>' + rows.length + ' 個機場一覽（狀況較差的排前面）</h2>' +
    '<div class="sr h"><span>機場</span><span>類別</span><span>風</span><span>能見度</span><span>雲幕</span><span>注意</span></div>' +
    rows.map(o => '<a class="sr" href="#c-' + o.k + '"><span><b>' + esc(o.name) + '</b><small>' + o.k + '</small></span><span>' + o.cat + '</span><span>' + o.wind +
      '</span><span>' + o.vis + '</span><span>' + o.ceil + '</span><span>' + (o.al.length ? '<span class="al">' + o.al.join('、') + '</span>' : '<span class="no">無</span>') + '</span></a>').join('');
}

// ---------- 資料 ----------
function demo(key) {
  const d = Object.assign({}, PRE[key][1]);
  const out = { updated: Date.now(), airports: {} };
  for (const k in META) out.airports[k] = Object.assign({ icao: META[k][0], name: META[k][1], obsTime: Date.now() / 1000 - 600 }, d);
  return out;
}

function render() {
  const msg = document.getElementById('msg'), bar = document.getElementById('bar');
  let src = mode === 'live' ? snap : demo(mode);
  if (mode === 'live' && API.indexOf('http') !== 0) {
    msg.style.display = 'block'; msg.textContent = '尚未設定資料來源：請把程式最上方的 API 改成你的 GAS /exec 網址。目前顯示示範資料。';
    src = demo('sunny');
  }
  if (!src || !src.airports) return;
  const H = mode === 'live' ? hist : null;
  let ch = false;
  for (const k in META) if (src.airports[k]) ch = upsert(k, src.airports[k], H && H[k]) || ch;
  if (ch) { renderSummary(); renderChips(); }
  const miss = Object.keys(META).filter(k => !src.airports[k]);
  if (mode === 'live' && API.indexOf('http') === 0 && miss.length) {
    msg.style.display = 'block';
    msg.textContent = '快照裡沒有 ' + miss.join('、') + ' 的資料：請確認 GAS 已貼上最新版並用「新版本」重新部署，或等下一輪抓取。';
  }
  stSrc = src; paintStatus();
}

async function get(q) {
  const ac = window.AbortController ? new AbortController() : null, to = ac && setTimeout(() => ac.abort(), 20000);
  try {
    const res = await fetch(API + q, ac ? { signal: ac.signal } : {});
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } finally { if (to) clearTimeout(to); }
}
const sigOf = d => Object.keys(d.airports || {}).map(k => k + d.airports[k].obsTime + d.airports[k].raw).join('|');
function schedule(ms) { clearTimeout(timer); timer = setTimeout(load, ms); }

async function load(force) {
  if (API.indexOf('http') !== 0) { render(); return; }
  if (document.hidden && !force) { pending = true; return; }      // 背景分頁不抓，回到前景再補
  clearTimeout(timer); pending = false;
  try {
    let d = await get('');                                         // 平常只抓最新快照（很小）
    const s2 = sigOf(d);
    if (!hist || s2 !== sig) {                                     // 第一次或出現新報，才多抓 24 小時歷史
      try { const h = await get('?history=24'); d = h; hist = h.history || hist; } catch (e) { /* 歷史失敗不影響最新資料 */ }
    }
    sig = s2; snap = d; fails = 0;
    document.getElementById('msg').style.display = 'none';
    const lo = d.status && d.status.lastFetchOk || 0;              // GAS 最近一次成功抓取的時間，推算下一次更新
    if (lastOk && lo > lastOk && lo - lastOk <= 960000) est = Math.round((est + Math.max(120000, lo - lastOk)) / 2);
    if (lo) lastOk = lo;
    let wait = lo ? lo + est + 20000 - Date.now() : est;
    late = wait > 0 ? 0 : late + 1;
    if (wait <= 0) wait = Math.min(30000 * Math.pow(2, late - 1), 120000);   // 預期的更新還沒到：短暫重試再退避
    schedule(wait + Math.random() * 45000);                        // 加隨機延遲，避免多人同一秒一起讀
  } catch (e) {
    fails++;
    const m = document.getElementById('msg');
    m.style.display = 'block'; m.textContent = '讀取失敗，顯示上一次的資料。請確認 /exec 網址與部署權限（存取權要選「所有人」）。';
    schedule(Math.min(30000 * Math.pow(2, fails - 1), 300000));
  }
  render();
}

function paintStatus() {
  const src = stSrc;
  if (!src) return;
  const age = Math.round((Date.now() - src.updated) / 60000);
  document.getElementById('st').textContent = mode === 'live' ? '快照 ' + hm(src.updated) + '（' + age + ' 分鐘前）' +
    (src.status && src.status.fails ? '　抓取失敗 ' + src.status.fails + ' 次：' + src.status.failReason : '') : '示範情境';
  document.getElementById('bar').classList.toggle('old', mode === 'live' && age > 25);
}
// 不連網，只更新畫面上的「幾分鐘前」
function tickAge() {
  if (document.hidden) return;
  document.querySelectorAll('.ago').forEach(e => { e.textContent = Math.max(0, Math.round((Date.now() / 1000 - Number(e.dataset.o)) / 60)) + ' 分鐘前'; });
  paintStatus(); refreshSun();
}

const sel = document.getElementById('mode');
sel.innerHTML = '<option value="live">即時資料</option>' + Object.keys(PRE).map(k => '<option value="' + k + '">預覽：' + PRE[k][0] + '</option>').join('');
sel.onchange = () => { mode = sel.value; render(); };

// ---------- 動畫與省電 ----------
// 自動：沒下雨 10 fps、下雨或雷暴 20 fps；3 分鐘沒操作降到 5 fps，20 分鐘沒操作停止動畫。
// 省電：只畫靜態畫面。完整：固定 30 fps。系統設定「減少動態效果」、資料節省、電量 20% 以下（不在充電）時，自動模式會改成省電。
let pref = 'auto', autoEco = false, lowBat = false, lastAct = Date.now(), running = false, need = true, loopT = null, last = 0;
try { pref = localStorage.getItem('pm') || 'auto'; } catch (e) { /* 無痕模式等情況讀不到就用預設 */ }
const PMN = { auto: '動畫：自動', eco: '動畫：省電', full: '動畫：完整' };
const powerMode = () => pref === 'auto' && autoEco ? 'eco' : pref;
const idleMs = () => Date.now() - lastAct;
function paintPw() { document.getElementById('pw').textContent = PMN[pref] + (pref === 'auto' && autoEco ? '（省電中）' : ''); }
function checkEco() {
  autoEco = !!((window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || (navigator.connection && navigator.connection.saveData) || lowBat);
  paintPw(); need = true; kick();
}
function wet() { for (const k in cards) { const c = cards[k]; if (c.s && c.vis !== false && (c.s.rain || c.s.snow || c.s.ts)) return true; } return false; }
function anyVis() { for (const k in cards) if (cards[k].s && cards[k].W && cards[k].vis !== false) return true; return false; }
function targetFps() {
  const m = powerMode();
  if (m === 'eco') return 0;
  if (m === 'full') return 30;
  const idle = idleMs();
  if (idle > 20 * 60e3) return 0;
  return Math.min(wet() ? 20 : 10, idle > 3 * 60e3 ? 5 : 99);
}
function frame() {
  loopT = null;
  if (document.hidden || !anyVis() || (!targetFps() && !need)) { running = false; return; }   // 背景、畫面外、靜態：不排任何計時器
  requestAnimationFrame(now => {
    if (document.hidden) { running = false; return; }
    const f = targetFps();                                 // 在畫之前重新判斷，避免剛好被點擊或切換模式時漏接
    const dt = f ? Math.min(.25, (now - last) / 1000) : 0; last = now;
    for (const k in cards) if (cards[k].s && cards[k].W && cards[k].vis !== false) draw(cards[k], now / 1000, dt);
    need = false;
    const f2 = targetFps();
    if (f2) loopT = setTimeout(frame, Math.max(0, 1000 / f2 - (performance.now() - now) - 8)); else running = false;   // 扣掉已用時間與等下一次垂直同步的時間
  });
}
function kick() { if (running || document.hidden) return; running = true; last = performance.now(); frame(); }
function refreshSun() {            // 太陽位置每分鐘校正一次，變動夠大才重畫靜態背景
  if (mode !== 'live') return;
  for (const k in cards) {
    const c = cards[k]; if (!c.s) continue;
    const m = META[k], sn = sun(m[2], m[3]);
    if (Math.abs(sn.e - c.s.e) > .4) { c.s.e = sn.e; c.s.ha = sn.ha; c.dirty = true; need = true; kick(); }
  }
}
['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(t => addEventListener(t, () => {
  const was = idleMs() > 3 * 60e3; lastAct = Date.now(); if (was) { need = true; kick(); }
}, { passive: true, capture: true }));
document.getElementById('pw').onclick = () => {
  pref = pref === 'auto' ? 'eco' : pref === 'eco' ? 'full' : 'auto';
  try { localStorage.setItem('pm', pref); } catch (e) { /* 存不了就只在這次有效 */ }
  paintPw(); need = true; kick();
};
if (navigator.getBattery) navigator.getBattery().then(b => {
  const f = () => { lowBat = !b.charging && b.level <= .2; checkEco(); };
  f(); b.addEventListener('levelchange', f); b.addEventListener('chargingchange', f);
}).catch(() => {});
checkEco();

document.getElementById('rf').onclick = () => load(true);
load(); setInterval(tickAge, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(timer); clearTimeout(loopT); loopT = null; running = false; return; }   // 背景時連計時器也停掉
  need = true; kick(); refreshSun();
  if (!snap || pending || !lastOk || Date.now() > lastOk + est + 20000) load();
  else { schedule(Math.max(5000, lastOk + est + 20000 - Date.now())); tickAge(); }
});
addEventListener('pageshow', e => { if (e.persisted) load(); });
</script>
</body>
